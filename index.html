<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="calculator-container" aria-label="Simple calculator">
    <div class="calculator" role="application" aria-labelledby="calc-title">
      <h1 id="calc-title" class="visually-hidden">Calculator</h1>

      <div class="display" id="display" aria-live="polite">0</div>

      <div class="buttons" role="group" aria-label="Calculator buttons">
        <button class="btn control" data-action="clear">C</button>
        <button class="btn control" data-action="back">DEL</button>
        <button class="btn control" data-value="(">(</button>
        <button class="btn control" data-value=")">)</button>

        <button class="btn number" data-value="7">7</button>
        <button class="btn number" data-value="8">8</button>
        <button class="btn number" data-value="9">9</button>
        <button class="btn operator" data-value="/">÷</button>

        <button class="btn number" data-value="4">4</button>
        <button class="btn number" data-value="5">5</button>
        <button class="btn number" data-value="6">6</button>
        <button class="btn operator" data-value="*">×</button>

        <button class="btn number" data-value="1">1</button>
        <button class="btn number" data-value="2">2</button>
        <button class="btn number" data-value="3">3</button>
        <button class="btn operator" data-value="-">−</button>

        <button class="btn number wide" data-value="0">0</button>
        <button class="btn number" data-value=".">.</button>
        <button class="btn operator" data-action="equals">=</button>
        <button class="btn operator" data-value="+">+</button>
      </div>
    </div>

    <p class="hint">Keyboard: numbers, + - * / ( ), Enter = evaluate, Backspace = DEL, Escape = C</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
